<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | ChunkMate</title>
    <link rel="stylesheet" href="../assets/styles/style.css" />
  </head>
  <body class="bg-light min-vh-100">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-shield-lock-fill"></i> Admin Panel</a>
        <a href="../index.html" class="btn btn-outline-light btn-sm" id="btn-admin-signout">Sign Out</a>
      </div>
    </nav>

    <main class="container my-5">
      <h2 class="mb-4 text-danger"><i class="bi bi-speedometer2"></i> System State</h2>
      
      <div class="row">
        <div class="col-md-4 mb-3">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold">Current User</div>
            <div class="card-body" id="admin-user-info">
              <!-- 유저 정보가 여기에 들어갑니다 -->
            </div>
          </div>
        </div>
        
        <div class="col-md-8 mb-3">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold">APP State (JSON Dump)</div>
            <div class="card-body bg-dark text-success rounded-bottom">
              <pre id="app-state-output" class="mb-0" style="max-height: 400px; overflow-y: auto;"></pre>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/scripts/app.js"></script>
  </body>
</html>
