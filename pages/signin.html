<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | ChunkMate</title>
    <link rel="stylesheet" href="../assets/styles/style.css" />
  </head>
  <body class="bg-light d-flex align-items-center min-vh-100">
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="card shadow-sm border-0 p-4">
            <div class="text-center mb-4">
              <i class="bi bi-chat-quote-fill text-primary fs-1"></i>
              <h2 class="fw-bold mt-2">Sign In</h2>
              <p class="text-muted">Welcome back to ChunkMate</p>
            </div>

            <form id="signin-form">
              <div class="mb-3">
                <label for="email-input" class="form-label"
                  >Email Address</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="email-input"
                  placeholder="student@una.edu"
                />
              </div>
              <div class="mb-4">
                <label for="password-input" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password-input"
                  placeholder="Enter password"
                />
              </div>
              <button
                type="button"
                class="btn btn-primary w-100 mb-3"
                id="login-submit-btn"
              >
                Sign In
              </button>
            </form>

            <div class="text-center">
              <a
                href="../index.html"
                class="text-decoration-none text-secondary"
                ><i class="bi bi-arrow-left"></i> Back to Home</a
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/scripts/app.js"></script>
  </body>
</html>
